name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: studioclayrity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: local
      NEXT_TELEMETRY_DISABLED: "1"
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/studioclayrity_test
      # The build pre-renders catalogue pages and e2e tests browse them, so both need data
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/studioclayrity_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

      - name: Migrations match the schema
        run: |
          pnpm exec drizzle-kit generate --name=ci-drift-check
          git diff --exit-code --stat -- drizzle || (echo "::error::Schema changed without a migration. Run pnpm db:generate and commit the result." && exit 1)
          test -z "$(git ls-files --others --exclude-standard drizzle)" || (echo "::error::Uncommitted migration files." && exit 1)

      - run: pnpm test
      - run: pnpm test:integration
      - name: Seed sample catalogue for build and e2e
        run: pnpm db:seed
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          E2E_BROWSER: chromium
